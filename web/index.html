<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>拥爱生命实验室 · 仿生物 AI 生命世界</title>
<style>
  /* 像素 UI 规格（2026-11-09 精修）：
     · 色板：所有颜色 ⊆ web/assets/palette.json 的 PICO-8 16 色，零色板外值。
     · 字号：Fusion Pixel 为 12px 点阵字体，非整数倍会糊 ⇒ 只允许 12 / 24，行高 20 / 32。
     · 网格：padding / gap 全部 8 的倍数；border 2px；硬阴影 4px 4px 0 #000（blur=0）。
     · 框体：border(外亮边) + ::before(内暗边 + 顶高光) = 9-slice 双层描边的 CSS 等效实现，
       不新增 PNG 资产（避免 pack-assets.mjs 的尺寸/类型校验拒收）。
     · 禁：圆角、渐变、模糊、抗锯齿、半透明叠加；hover/active 一律换色 + 1px 位移。 */
  @font-face { font-family:"fusion-pixel"; src:url("/web/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.woff2") format("woff2"); font-display:swap; }
  :root {
    --bg:#000000; --panel:#1D2B53; --sunken:#000000;
    --line:#5F574F; --line-hi:#83769C;
    --ink:#FFF1E8; --dim:#C2C3C7;
    --a:#29ADFF; --b:#FFA300; --warn:#FF004D; --ok:#00E436; --gold:#FFEC27;
    --shadow:#000000;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:12px/20px "fusion-pixel","Segoe UI",system-ui,sans-serif; }

  /* ── 框体：双层描边 + 顶部内高光 ── */
  header, #mapbar, .world, aside, details.lab {
    position:relative; border:2px solid var(--line-hi); background:var(--panel);
    box-shadow:4px 4px 0 0 var(--shadow);
  }
  header::before, #mapbar::before, .world::before, aside::before, details.lab::before {
    content:""; position:absolute; inset:2px; border:2px solid var(--line);
    border-top-color:var(--line-hi); pointer-events:none; z-index:2;
  }

  header { padding:8px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { margin:0; font-size:24px; line-height:32px; letter-spacing:0; }
  h1 span { color:var(--dim); font-weight:400; margin-left:16px; font-size:12px; }
  .backend { font-size:12px; color:var(--dim); border:2px solid var(--line); background:var(--sunken); padding:2px 10px; box-shadow:2px 2px 0 0 var(--shadow); }
  .backend.on { color:var(--bg); background:var(--ok); border-color:var(--ink); font-weight:700; }
  .backend.bad { color:var(--ink); background:var(--warn); border-color:var(--ink); font-weight:700; }

  #mapbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 16px; margin-bottom:8px; }
  #mapbar .lbl { color:var(--dim); font-size:12px; margin-right:8px; }
  #minimap { display:flex; gap:8px; flex-wrap:wrap; }

  /* ── 按钮四态：常态 / hover / active / 选中 / 禁用，全部换色，不用透明度 ── */
  #minimap button, #btnOverview, .ctl button, .say button, .hailrow button, .secrets .who button {
    background:var(--sunken); color:var(--dim); border:2px solid var(--line);
    padding:4px 10px; font-size:12px; line-height:20px; cursor:pointer; font-family:inherit;
    box-shadow:2px 2px 0 0 var(--shadow);
  }
  #minimap button:hover, #btnOverview:hover, .ctl button:hover, .hailrow button:hover, .secrets .who button:hover {
    color:var(--ink); border-color:var(--a); background:var(--panel);
  }
  #minimap button:active, #btnOverview:active, .ctl button:active, .say button:active,
  .hailrow button:active, .secrets .who button:active {
    transform:translate(1px,1px); box-shadow:1px 1px 0 0 var(--shadow);
  }
  #minimap button:focus-visible, #btnOverview:focus-visible, .ctl button:focus-visible,
  .say button:focus-visible, .say input:focus-visible, .hailrow button:focus-visible, .secrets .who button:focus-visible {
    outline:2px solid var(--gold); outline-offset:2px;
  }
  #minimap button.on, .ctl button.on, #btnOverview.on {
    color:var(--bg); background:var(--gold); border-color:var(--ink); font-weight:700;
  }
  #minimap button .n { color:var(--dim); margin-left:5px; font-size:12px; }
  #minimap button.on .n { color:var(--bg); }
  #btnOverview { margin-left:auto; }

  main { display:flex; gap:16px; padding:16px; align-items:stretch; min-height:calc(100vh - 176px); }
  .col { flex:1 1 0; min-width:0; display:flex; }
  .world { flex:1; padding:16px 8px 8px; display:flex; flex-direction:column; }
  .side-a .wtit { border-bottom-color:var(--a); }
  .side-b .wtit { border-bottom-color:var(--b); }
  .wtit { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px; padding:0 8px 4px; border-bottom:2px solid var(--line); }
  .wtit b { font-size:12px; letter-spacing:0; }
  .side-a .wtit b { color:var(--a); }
  .side-b .wtit b { color:var(--b); }
  .wtit i { font-style:normal; color:var(--dim); font-size:12px; text-align:right; }
  canvas { display:block; margin:16px auto; background:var(--bg); image-rendering:pixelated; image-rendering:crisp-edges; border:2px solid var(--line); box-shadow:2px 2px 0 0 var(--shadow); }

  /* ── 角色卡：像素头像框 + 侧色块 + 台词气泡（阶梯尾巴，不用斜边三角形） ── */
  .occ { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:16px; }
  .occ .card {
    position:relative; display:flex; gap:8px; align-items:flex-start; border:2px solid var(--line);
    background:var(--sunken); padding:8px; min-width:160px; flex:1 1 160px;
    box-shadow:2px 2px 0 0 var(--shadow);
  }
  .side-a .occ .card { border-left:4px solid var(--a); }
  .side-b .occ .card { border-left:4px solid var(--b); }
  .occ .card img { width:32px; height:32px; flex:0 0 32px; image-rendering:pixelated; border:2px solid var(--line-hi); background:var(--panel); }
  .occ .card .who { min-width:0; }
  .occ .card .who b { display:block; font-size:12px; }
  .occ .card .who span { display:block; color:var(--dim); font-size:12px; }
  .occ .card .sayline {
    position:relative; display:block; margin-top:8px; padding:2px 6px; font-size:12px; line-height:20px;
    color:var(--ink); background:var(--panel); border:2px solid var(--line-hi);
  }
  .occ .card .sayline::before, .occ .card .sayline::after { content:""; position:absolute; background:var(--line-hi); }
  .occ .card .sayline::before { top:-4px; left:8px; width:6px; height:2px; }
  .occ .card .sayline::after { top:-6px; left:8px; width:2px; height:4px; }
  .occ .empty { color:var(--dim); font-size:12px; padding:8px; }

  aside { width:336px; flex:0 0 336px; padding:16px 8px 8px; display:flex; flex-direction:column; }
  aside h2 { font-size:12px; margin:16px 0 8px; letter-spacing:0; color:var(--ink); font-weight:700; padding:0 8px 2px; border-bottom:2px solid var(--line); }
  aside h2:first-child { margin-top:0; }
  aside h2::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; background:var(--gold); border:2px solid var(--bg); vertical-align:0; }
  .ctl { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .say { display:flex; gap:8px; margin-bottom:8px; }
  .say input { flex:1; min-width:0; background:var(--sunken); color:var(--ink); border:2px solid var(--line); padding:4px 8px; font-size:12px; font-family:inherit; box-shadow:inset 2px 2px 0 0 var(--shadow); }
  .say input::placeholder { color:var(--line); }
  .say button { background:var(--a); color:var(--bg); border-color:var(--ink); font-weight:700; }
  .say button:hover { background:var(--ink); color:var(--bg); border-color:var(--a); }
  .hailrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-size:12px; align-items:center; }
  .hailrow span { color:var(--dim); }
  .social, .secrets { margin-bottom:8px; font-size:12px; }
  .secrets { max-height:216px; overflow-y:auto; padding-right:4px; }
  .social .s, .secrets .s { border-left:4px solid var(--line-hi); padding:4px 8px; margin-bottom:4px; color:var(--dim); background:var(--sunken); }
  .social .s b, .secrets .s b { color:var(--ink); font-weight:700; }
  .secrets .who { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  .secrets .who button { padding:1px 7px; }
  .secrets .who button.done { border-style:dashed; border-color:var(--line); color:var(--line); background:var(--bg); box-shadow:none; cursor:default; }
  .empty { color:var(--dim); }
  details.lab { border-color:var(--line); background:var(--sunken); margin-top:auto; }
  details.lab::before { border-color:var(--line); border-top-color:var(--line-hi); }
  details.lab summary { cursor:pointer; padding:8px; font-size:12px; color:var(--dim); letter-spacing:0; }
  details.lab summary:hover { color:var(--ink); }
  details.lab[open] summary { border-bottom:2px solid var(--line); color:var(--ink); }
  details.lab .inner { padding:8px; }
  .rows { margin-top:8px; display:grid; gap:8px; }
  .row { display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:center; }
  .nm { color:var(--dim); font-size:12px; line-height:20px; }
  .nm b { color:var(--ink); font-weight:700; }
  /* 分段像素格：10 格 × 4px + 9 × 1px 间隙 = 49px，亮格=当前值，描边格=基线 */
  .bars { display:flex; gap:4px; margin-bottom:4px; flex-wrap:wrap; }
  .bar { display:flex; gap:1px; height:8px; width:49px; }
  .bar b { flex:0 0 4px; background:var(--line); border:1px solid var(--bg); }
  .bar b.on { background:var(--a); }
  #rowsB .bar b.on { background:var(--b); }
  .bar b.base { box-shadow:inset 0 0 0 1px var(--ink); }
  .pick { font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pick em { font-style:normal; color:var(--dim); margin-left:7px; }
  .spark { display:block; margin:4px 0 0; }
  .sched { margin-left:8px; color:var(--dim); font-size:12px; }
  .sched.on { color:var(--ok); }
  .tag { font-size:12px; color:var(--dim); border:2px solid var(--line); padding:0 6px; margin-left:6px; }
  .tag.act { color:var(--ink); border-color:var(--a); }
  .wstat { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 4px; font-size:12px; color:var(--dim); }
  .wstat b { color:var(--ink); font-weight:700; }
  .wstat b.bad { color:var(--warn); }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  th, td { border-bottom:2px solid var(--line); text-align:right; padding:4px 0; }
  th:first-child, td:first-child { text-align:left; color:var(--dim); }
  .log { height:200px; overflow-y:auto; border-top:2px solid var(--line); padding-top:8px; font-size:12px; }
  .log div { padding:1px 0; }
  .log .A { color:var(--a); } .log .B { color:var(--b); }
  .log .rej { color:var(--warn); } .log .disc { color:var(--ok); }
  .log .P { color:var(--ink); } .log .tell { color:var(--gold); } .log .norm { color:#FF77A8; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }

  #toasts { position:fixed; top:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:320px; }
  #toasts .toast {
    border:2px solid var(--warn); background:var(--panel); color:var(--ink); padding:8px; font-size:12px;
    box-shadow:4px 4px 0 0 var(--shadow); animation:toast-in 240ms steps(4,end) both;
  }
  #toasts .toast.ok { border-color:var(--ok); }
  @keyframes toast-in { from { transform:translateX(24px); } to { transform:translateX(0); } }
  @media (prefers-reduced-motion: reduce) { #toasts .toast { animation:none; } }

  /* 底部图例：把空白收住，并给出 A/B 与色板的读图约定 */
  footer { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:8px 16px; margin:0 16px 16px; border:2px solid var(--line); background:var(--sunken); font-size:12px; color:var(--dim); }
  footer .key { display:inline-block; width:8px; height:8px; border:2px solid var(--ink); margin-right:4px; vertical-align:0; }
  footer .key.a { background:var(--a); } footer .key.b { background:var(--b); }
  footer .key.g { background:var(--gold); } footer .key.w { background:var(--warn); }
  footer b { color:var(--ink); font-weight:700; }

  @media (max-width:1100px) {
    main { flex-direction:column; align-items:stretch; min-height:0; }
    .col { width:100%; }
    main > aside { width:100%; flex:auto; }
    #mapbar { flex-wrap:nowrap; overflow-x:auto; }
    #minimap { flex-wrap:nowrap; }
    footer { margin:0 8px 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>拥爱生命实验室<span>同一颗种子、两个世界：左边内部状态参与决策，右边切断。</span></h1>
  <div id="backend" class="backend">后端：读取中…</div>
</header>
<div id="mapbar">
  <span class="lbl">镜头</span>
  <div id="minimap"></div>
  <span class="lbl" id="visionInfo"></span>
  <button id="btnOverview" title="切换局部放大视角 / 完整世界全景">世界全景</button>
</div>
<main>
  <div class="col">
    <div class="world side-a">
      <div class="wtit"><b>A · 通道开</b><i id="tagA"></i></div>
      <canvas id="cvA" width="384" height="256"></canvas>
      <div class="occ" id="occA"></div>
    </div>
  </div>
  <div class="col">
    <div class="world side-b">
      <div class="wtit"><b>B · 通道切断</b><i id="tagB"></i></div>
      <canvas id="cvB" width="384" height="256"></canvas>
      <div class="occ" id="occB"></div>
    </div>
  </div>
  <aside>
    <h2>控制</h2>
    <div class="ctl">
      <button id="btnRun" class="on">▶ 运行</button>
      <button id="btnStep">单步</button>
      <button id="btnBrain" title="切换内心来源">内心：本地替身</button>
      <button id="btnM3" title="M3 目标承诺层（默认关）">M3 承诺期</button>
      <button id="btnM4" title="M4 耦合调制权（默认关）">M4 耦合调制</button>
      <button id="btnSleep" title="假装容器休眠 45 分钟">休眠 45 分钟</button>
      <button id="btnReset">重置世界</button>
    </div>
    <h2>你（玩家）</h2>
    <div class="say">
      <input id="sayText" placeholder="对他们说一句话，两个世界收到同一句" />
      <button id="btnSay">说</button>
    </div>
    <div class="hailrow" id="hail"></div>
    <h2>关系与规范</h2>
    <div id="social" class="social"></div>
    <h2>你知道的事</h2>
    <div id="secrets" class="secrets"></div>
    <details class="lab" id="labPanel">
      <summary>实验面板 · 判据 / 对照 / 日志</summary>
      <div class="inner">
        <div class="wstat" id="statA"></div>
        <div class="rows" id="rowsA"></div>
        <div class="wstat" id="statB"></div>
        <div class="rows" id="rowsB"></div>
        <table id="tbl"></table>
        <div class="note">世界是一整片 96×64 格的自然地形，屏幕只取 16×15 格的放大视角；点地点条移镜头，点画面走过去。两个世界收到同一个动作。M3/M4 默认关，切上只叠 A 侧并回起点重放。</div>
        <h2>事件</h2>
        <div class="log" id="log"></div>
      </div>
    </details>
  </aside>
</main>
<footer>
  <span><b>读图</b></span>
  <span><i class="key a"></i>A 侧 · 承重通道开</span>
  <span><i class="key b"></i>B 侧 · 承重通道切断</span>
  <span><i class="key g"></i>地点 / 镜头位置</span>
  <span><i class="key w"></i>驳回 / 永久损失</span>
  <span>世界 96×64 格完整运行，屏幕只取 16×15 格放大视角；树与屋舍挡视线。</span>
</footer>
<div id="toasts"></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
