<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拥爱生命实验室 · 仿生物 AI 生命世界</title>
<style>
  @font-face { font-family:"fusion-pixel"; src:url("/web/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.woff2") format("woff2"); font-display:swap; }
  :root { --bg:#0b0d12; --panel:#12151c; --line:#2a3040; --ink:#e8ecf4; --dim:#9aa4b8; --a:#6ea8fe; --b:#f0a35e; --warn:#e06c75; --ok:#5fbf8f; --gold:#ffec27; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "fusion-pixel","Segoe UI",system-ui,sans-serif; }
  header { padding:12px 16px; border-bottom:2px solid var(--line); display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--panel); }
  h1 { margin:0; font-size:18px; letter-spacing:.06em; }
  h1 span { color:var(--dim); font-weight:400; margin-left:10px; font-size:12px; }
  .backend { font-size:12px; color:var(--dim); border:2px solid var(--line); padding:2px 10px; }
  .backend.on { color:#0b0d12; background:var(--ok); border-color:var(--ok); font-weight:700; }
  .backend.bad { color:#fff; background:var(--warn); border-color:var(--warn); font-weight:700; }
  #mapbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:2px solid var(--line); }
  #mapbar .lbl { color:var(--dim); font-size:12px; margin-right:4px; }
  #minimap { display:flex; gap:6px; flex-wrap:wrap; }
  #minimap button { background:#171b24; color:var(--ink); border:2px solid var(--line); padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  #minimap button.on { border-color:var(--gold); color:var(--gold); }
  #minimap button .n { color:var(--dim); margin-left:5px; font-size:11px; }
  #btnOverview { margin-left:auto; background:#171b24; color:var(--dim); border:2px solid var(--line); padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  #btnOverview.on { color:var(--ink); border-color:var(--a); }
  main { display:flex; gap:14px; padding:14px 16px; align-items:flex-start; }
  .col { flex:1 1 0; min-width:0; }
  .world { border:2px solid var(--line); background:var(--panel); padding:10px; box-shadow:4px 4px 0 #000; }
  .wtit { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px; }
  .wtit b { font-size:15px; letter-spacing:.04em; }
  .wtit i { font-style:normal; color:var(--dim); font-size:12px; text-align:right; }
  canvas { display:block; margin:0 auto; background:#000; image-rendering:pixelated; image-rendering:crisp-edges; }
  .occ { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .occ .card { display:flex; gap:8px; align-items:center; border:2px solid var(--line); background:#171b24; padding:6px 8px; min-width:150px; flex:1 1 150px; }
  .occ .card img { width:32px; height:32px; image-rendering:pixelated; }
  .occ .card .who b { display:block; font-size:13px; }
  .occ .card .who span { display:block; color:var(--dim); font-size:11px; }
  .occ .card .sayline { color:var(--ink); font-size:11.5px; margin-top:2px; }
  .occ .empty { color:var(--dim); font-size:12px; padding:6px; }
  @media (max-width:1100px) { main { flex-direction:column; align-items:stretch; } .col { width:100%; } main > aside { width:100%; flex:auto; } }
  aside { width:330px; flex:0 0 330px; border:2px solid var(--line); background:var(--panel); padding:10px; box-shadow:4px 4px 0 #000; }
  aside h2 { font-size:12px; margin:10px 0 6px; letter-spacing:.08em; color:var(--dim); font-weight:700; }
  aside h2:first-child { margin-top:0; }
  .ctl { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .ctl button { background:#171b24; color:var(--ink); border:2px solid var(--line); padding:5px 9px; font-size:12px; cursor:pointer; font-family:inherit; }
  .ctl button.on { border-color:var(--a); color:#fff; }
  .say { display:flex; gap:6px; margin-bottom:8px; }
  .say input { flex:1; min-width:0; background:#0d1016; color:var(--ink); border:2px solid var(--line); padding:6px 8px; font-size:12px; font-family:inherit; }
  .say button { background:var(--a); color:#0b0d12; border:2px solid var(--a); padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .hailrow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; font-size:11.5px; align-items:center; }
  .hailrow span { color:var(--dim); }
  .hailrow button { background:#171b24; color:var(--ink); border:2px solid var(--line); padding:3px 9px; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .hailrow button:hover { border-color:var(--a); }
  .social, .secrets { margin-bottom:8px; font-size:11.5px; }
  .social .s, .secrets .s { border-left:3px solid var(--line); padding:3px 0 3px 7px; margin-bottom:4px; color:var(--dim); }
  .social .s b, .secrets .s b { color:var(--ink); font-weight:700; }
  .secrets .who { display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .secrets .who button { background:#171b24; color:var(--ink); border:2px solid var(--line); padding:1px 7px; font-size:11px; cursor:pointer; font-family:inherit; }
  .secrets .who button.done { opacity:.35; cursor:default; border-style:dashed; }
  .empty { color:var(--dim); }
  details.lab { border:2px solid var(--line); background:#171b24; margin-top:10px; }
  details.lab summary { cursor:pointer; padding:6px 8px; font-size:12px; color:var(--dim); letter-spacing:.06em; }
  details.lab[open] summary { border-bottom:2px solid var(--line); color:var(--ink); }
  details.lab .inner { padding:8px; }
  .rows { margin-top:4px; display:grid; gap:5px; }
  .row { display:grid; grid-template-columns:58px 1fr; gap:8px; align-items:center; }
  .nm { color:var(--dim); font-size:12px; line-height:1.25; }
  .nm b { color:var(--ink); font-weight:700; }
  .bars { display:flex; gap:3px; margin-bottom:2px; }
  .bar { display:flex; gap:1px; height:10px; width:44px; }
  .bar b { flex:1; background:#0d1016; }
  .bar b.on { background:#3d4757; }
  .bar b.base { box-shadow: inset 0 0 0 1px #6b7689; }
  .pick { font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pick em { font-style:normal; color:var(--dim); margin-left:7px; }
  .spark { display:block; margin:4px 0 0; opacity:.95; }
  .sched { margin-left:8px; color:var(--dim); font-size:11px; }
  .sched.on { color:var(--ok); }
  .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); padding:0 6px; margin-left:6px; }
  .tag.act { color:var(--ink); border-color:var(--a); }
  .wstat { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 2px; font-size:12px; color:var(--dim); }
  .wstat b { color:var(--ink); font-weight:700; }
  .wstat b.bad { color:var(--warn); }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  th, td { border-bottom:1px solid var(--line); text-align:right; padding:3px 0; }
  th:first-child, td:first-child { text-align:left; color:var(--dim); }
  .log { height:200px; overflow-y:auto; border-top:2px solid var(--line); padding-top:6px; font-size:11.5px; }
  .log div { padding:1px 0; }
  .log .A { color:var(--a); } .log .B { color:var(--b); }
  .log .rej { color:var(--warn); } .log .disc { color:var(--ok); }
  .log .P { color:#d7dde6; } .log .tell { color:#e7c26a; } .log .norm { color:var(--warn); }
  .note { color:var(--dim); font-size:11px; margin-top:8px; }
  #toasts { position:fixed; top:12px; right:12px; display:flex; flex-direction:column; gap:6px; z-index:50; max-width:320px; }
  #toasts .toast { border:2px solid var(--warn); background:#1a0f12; color:var(--ink); padding:6px 10px; font-size:12px; box-shadow:3px 3px 0 #000; }
  #toasts .toast.ok { border-color:var(--ok); background:#0f1a14; }
</style>
</head>
<body>
<header>
  <h1>拥爱生命实验室<span>同一颗种子、两个世界：左边内部状态参与决策，右边切断。</span></h1>
  <div id="backend" class="backend">后端：读取中…</div>
</header>
<div id="mapbar">
  <span class="lbl">镜头</span>
  <div id="minimap"></div>
  <button id="btnOverview" title="切换聚焦房间 / 八间全景">全景</button>
</div>
<main>
  <div class="col">
    <div class="world">
      <div class="wtit"><b style="color:var(--a)">A · 通道开</b><i id="tagA"></i></div>
      <canvas id="cvA" width="384" height="256"></canvas>
      <div class="occ" id="occA"></div>
    </div>
  </div>
  <div class="col">
    <div class="world">
      <div class="wtit"><b style="color:var(--b)">B · 通道切断</b><i id="tagB"></i></div>
      <canvas id="cvB" width="384" height="256"></canvas>
      <div class="occ" id="occB"></div>
    </div>
  </div>
  <aside>
    <h2>控制</h2>
    <div class="ctl">
      <button id="btnRun" class="on">▶ 运行</button>
      <button id="btnStep">单步</button>
      <button id="btnBrain" title="切换内心来源">内心：本地替身</button>
      <button id="btnM3" title="M3 目标承诺层（默认关）">M3 承诺期</button>
      <button id="btnM4" title="M4 耦合调制权（默认关）">M4 耦合调制</button>
      <button id="btnSleep" title="假装容器休眠 45 分钟">休眠 45 分钟</button>
      <button id="btnReset">重置世界</button>
    </div>
    <h2>你（玩家）</h2>
    <div class="say">
      <input id="sayText" placeholder="对他们说一句话，两个世界收到同一句" />
      <button id="btnSay">说</button>
    </div>
    <div class="hailrow" id="hail"></div>
    <h2>关系与规范</h2>
    <div id="social" class="social"></div>
    <h2>你知道的事</h2>
    <div id="secrets" class="secrets"></div>
    <details class="lab" id="labPanel">
      <summary>实验面板 · 判据 / 对照 / 日志</summary>
      <div class="inner">
        <div class="wstat" id="statA"></div>
        <div class="rows" id="rowsA"></div>
        <div class="wstat" id="statB"></div>
        <div class="rows" id="rowsB"></div>
        <table id="tbl"></table>
        <div class="note">点房间可让「你」走过去；两个世界收到同一个动作。M3/M4 默认关，切上只叠 A 侧并回起点重放。</div>
        <h2>事件</h2>
        <div class="log" id="log"></div>
      </div>
    </details>
  </aside>
</main>
<div id="toasts"></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
