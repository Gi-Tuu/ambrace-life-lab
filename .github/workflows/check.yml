name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI 默认无 Chrome：REQUIRE_CHROME=1 时浏览器用例必须失败而非静默 skip；0 表示显式标注跳过。
      REQUIRE_CHROME: '0'
      CI_CHROME: 'skip-if-missing'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Static check
        run: npm run lint
      - name: Art fingerprints
        run: npm run art:check
      - name: Full tests
        run: npm test
      - name: Save round-trip
        run: node --test life/save-archive.test.mjs life/camp-saves.test.mjs

