<!doctype html><meta charset="utf-8"><title>美术资产图鉴</title>
<style>
body{margin:0;padding:24px;background:#202a23;color:#edd8b0;font:14px system-ui}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 10px;border-bottom:1px solid #4a5a48;padding-bottom:6px}
.bar{position:sticky;top:0;background:#202a23;padding:10px 0;z-index:2}
button{padding:6px 14px;margin-right:8px;background:#31402f;color:#edd8b0;border:1px solid #6b7a58;cursor:pointer}
button.on{background:#6b7a58;color:#18251e}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.card{width:212px;background:#26332a;border:1px solid #3c4a3a;padding:8px}
.card canvas,.card img{width:196px;height:150px;background:#1a241c;display:block;image-rendering:pixelated;object-fit:contain}
.card .age-portrait{float:right;width:32px;height:32px;margin:5px 7px 0 0;border:1px solid #6b7a58}
.name{margin:6px 0 2px;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border:1px solid}
.tag.done{color:#98BD51;border-color:#568D3E}
.tag.todo{color:#c9b88f;border-color:#6b6250}
.note{font-size:12px;color:#a8b096;margin-top:4px;min-height:16px}
.count{color:#a8b096;font-size:13px;margin-left:10px}
</style>
<h1>美术资产图鉴</h1>
<div class="bar"><button data-f="all" class="on">全部</button><button data-f="todo">只看未翻新</button><button data-f="done">只看已翻新</button><button data-f="live">只看服役中</button><span class="count" id="count"></span></div>
<div id="root"></div>
<script type="module">
import {addCampWork,outdoorStage,outdoorLife,regionLife,roomStage,wildVegetation} from '/shared/camp-scene.mjs';
import {itemBoxes} from '/shared/camp-items.mjs';
import {modelBounds} from '/shared/camp-geometry.mjs';
import {actorBoxes,animalBoxes,createCampRenderer,campCamera} from '/web/camp-3d-render.mjs';
import {campClimate,paintWeather,plotWeather,stormEffects} from '/web/camp-weather.mjs';
import {solarLight} from '/web/camp-sun.mjs';
import {residentPortrait} from '/web/resident-portrait.mjs';
const renderer=createCampRenderer();
const DONE={granary:'屋顶＋入口＋八角储粮桶',shelter:'屋顶＋门框窗台',workshop:'屋顶＋工作台',hall:'屋顶（开敞）',watch:'屋顶（开敞）',store:'屋顶（封闭山墙）',
 house:'入口门框＋窗台窗楣',wall:'柱帽（随破损递减）',garden:'连续双坡顶',well:'连续双坡顶＋辘轳曲柄',yard:'畜栏棚连续双坡顶',
 chickens:'成鸡双翼',cows:'尾穗',sheep:'额毛',bird:'冠羽＋尾尖',rabbit:'内耳',deer:'鹿角',
 grain:'盖压条',bed:'床尾板＋毯折',hearth:'烟囱帽箍',furnace:'烟囱帽箍',table:'腿间横撑',workbench:'横撑＋下层板',rug:'流苏',shelf:'顶冠',planter:'盆沿',trellis:'盆沿',bench:'横撑',banner:'杆帽',crate:'盖压条',barrel:'八角倒角',bucket:'八角倒角',telescope:'三脚垫',anvil:'底座',fence:'柱帽',cart:'栏桩＋握把',
 backpack:'扣带＋顶绊',pointer:'握柄环',hand:'拇指',axe:'刃口高光＋柄箍',pick:'刃口高光＋柄箍',hoe:'刃口高光＋柄箍',hammer:'刃口高光＋柄箍',basket:'织带＋提手',shears:'铆钉',wood:'年轮＋断口',stone:'苔面＋亮脊',berry:'叶＋亮点',fruit:'叶＋腮红',crop:'穗＋土块',egg:'斑点',wool:'绒团',meat:'骨＋脂',milk:'标签＋帽',water:'标签＋浪',tray:'底纹＋钮',sack:'扎口＋绳',
 tree0:'树冠倾斜/高矮＋根盘落叶',tree1:'树冠倾斜/高矮＋根盘落叶',tree2:'树冠倾斜/高矮＋根盘落叶',tree3:'树冠倾斜/高矮＋根盘落叶'};
const lot={x:0,z:0,w:4,d:3.2};
const building=t=>{const boxes=[];addCampWork(boxes,{settlementLife:true,buildings:[{type:t,loc:'yard',lot,integrity:1}],sites:[],store:12,storeCap:24},[]);return boxes;};
const site=id=>{const s=outdoorStage({tw:24,th:24,hills:[],trees:[],grass:[],sites:{[id]:[10,14]}},[],[]);return s.boxes.filter(b=>(b.occluder||'').startsWith('site:'+id)||(b.occluder||'').startsWith('roof:'));};
const pen=()=>{const s=outdoorStage({tw:24,th:24,hills:[],trees:[],grass:[],sites:{yard:[6,6]}},[],[]);return s.boxes.filter(b=>!(b.occluder||'').startsWith('site:')&&!(b.occluder||'').startsWith('tree:'));};
const animal=kind=>{const s=outdoorLife({tw:24,th:24,sites:{yard:[6,6]},livestock:{chickens:1,cows:1,sheep:1},beds:[],flora:[]});const a=s.animals.find(a=>a.kind===kind);return a?a.boxes:[];};
const wild=kind=>{const s=regionLife([],[{kind,x:5,z:5,y:0}]);const a=s.animals.find(a=>a.kind===kind);return a?a.boxes:s.boxes;};
const tree=v=>wildVegetation([{x:2,y:0,z:2,variant:v,scale:1}],[]).boxes;
const prop=kind=>{const s=roomStage('home',[[kind,60,60]],{},16,12);return s.interactables[0]?.boxes??[];};
const item=id=>itemBoxes(id).map(([x,y,z,w,h,d,c])=>({x,y,z,w,h,d,color:c}));
const previewTime=.68;
const fox=regionLife([],[{id:'catalog-fox',kind:'fox',x:0,z:0}]).animals[0];
const foxPreview=pose=>{
 const animal={...fox,phase:0,...pose};
 return {boxes:animalBoxes(animal,previewTime),work:[],animals:[animal],weather:[previewTime,0,0,0],
  shot:{x:0,z:0,span:2.15,targetY:.38}};
};
const residentPreview=stage=>{
 const resident={id:'c1',stage,sex:'f'};
 const actor={...resident,who:resident.id,x:0,y:0,z:0,direction:'down'};
 return {boxes:actorBoxes(actor,0),work:[],people:[actor],portrait:residentPortrait(resident),
  shot:{x:0,z:0,span:2.72,targetY:.72,pitch:.32,yaw:.35}};
};
const windEvent={kind:'storm_impact',stormDay:2,plot:{id:0,after:.74}};
const wind={disasterToday:'storm',day:2,settlementEvents:[windEvent]};
function cropBoxes(growth,world={},moisture=0){
 const beds=plotWeather(world,[{id:0,x:16,y:34,w:64,h:32,growth,moisture}]);
 return outdoorLife({tw:8,th:6,sites:{},beds,flora:[]}).boxes.filter(b=>b.occluder==='plot:0');
}
const cropPreview=(growth,world,moisture)=>({
 boxes:cropBoxes(growth,world,moisture),shot:{x:3,z:3.13,span:5.5,targetY:.32,pitch:.62,yaw:.35},
});
const weatherStage=wildVegetation([{x:2.5,z:1.4,y:0,variant:1,scale:.75}],[{x:5.8,z:1.8,y:0,variant:0,kind:'reed'}]);
weatherStage.width=8;
weatherStage.depth=6;
weatherStage.floor(0,0,8,6,0,'#568D3E');
weatherStage.box(5.2,.012,2.55,2.08,.065,1.86,'#797768');
weatherStage.box(5.59,.07,2.88,1.3,.009,1.12,'#2D5D6E',false,false,null,{glow:-1});
function weatherPreview(world) {
 const climate=campClimate({season:'夏',...world});
 const sun=solarLight(12,24,climate.season,{storm:climate.storm,overcast:climate.rain||climate.snow});
 const impacts=stormEffects({active:climate.storm,time:previewTime,focus:[4,3],
  bounds:{west:0,east:8,north:0,south:6},surface:(x,z)=>{
   const water=x>=5.59 && x<=6.89 && z>=2.88 && z<=4;
   return {y:water?.079:0,water};
  }});
 return {boxes:cropBoxes(.74,world),stage:weatherStage,shot:{x:4,z:3,span:10,targetY:.76,pitch:.58,yaw:.32},
  sun,light:sun.light,season:climate.season,wetness:climate.storm?.95:climate.rain?.65:0,
  weather:[previewTime,climate.storm?2.7:climate.rain?1.15:.55,Number(climate.frost),sun.glow],
  impacts,climate};
}
const NEW_ASSETS={
 fox:'赤褐色被毛、浅色嘴部和尾尖',
 'fox-alert':'接近时抬头，转向来者',
 'fox-meal':'接受投喂时低头进食',
 'resident-infant':'襁褓和婴儿头像',
 'resident-child':'儿童身型、衣型和头像',
 'resident-adult':'成年身型、衣型和头像',
 'resident-elder':'灰发、老年身型和头像',
 'plot-empty':'空畦和采收后都显示裸土',
 'plot-seedling':'播种后出现矮苗',
 'plot-growing':'植株长高，长出穗头',
 'plot-ripe':'金色穗头，达到可采收状态',
 'plot-watered':'湿润畦土颜色更深',
 'plot-drought':'土壤开裂，叶片褪色下垂',
 'plot-storm':'部分植株倒伏',
 'weather-clear':'白昼光照',
 'weather-rain':'雨线和湿面反光',
 'weather-snow':'冬季地表和飘雪',
 'weather-frost':'寒潮时露天表面挂霜',
 'weather-storm':'斜雨、风动、落地水花和飞叶',
 'weather-drought':'干旱时畦土开裂、作物萎蔫',
};
const SECTIONS=[
 ['建筑与点位',[
  ['granary','粮仓',()=>building('granary')],['shelter','住所',()=>building('shelter')],['workshop','工棚',()=>building('workshop')],
  ['house','私人住宅外壳',()=>building('house')],['wall','围墙',()=>building('wall')],
  ['hall','主厅',()=>site('hall')],['watch','瞭望塔',()=>site('watch')],['store','旧式仓库外壳 house()',()=>site('store')],
  ['garden','菜园设施',()=>site('garden')],['well','水井设施',()=>site('well')],['yard','畜栏结构',pen]]],
 ['植被',[['tree0','树·冠形0',()=>tree(0)],['tree1','树·冠形1',()=>tree(1)],['tree2','树·冠形2',()=>tree(2)],['tree3','树·冠形3',()=>tree(3)]]],
 ['动物',[['chickens','鸡',()=>animal('chickens')],['cows','牛',()=>animal('cows')],['sheep','羊',()=>animal('sheep')],
  ['bird','野鸟',()=>wild('bird')],['rabbit','野兔',()=>wild('rabbit')],['deer','鹿',()=>wild('deer')],
  ['fox','狐狸',()=>foxPreview({})],['fox-alert','狐狸 · 警觉',()=>foxPreview({alert:true,watch:[1,2]})],
  ['fox-meal','狐狸 · 进食',()=>foxPreview({meal:.44})]]],
 ['人物四龄',[['infant','婴儿'],['child','儿童'],['adult','成年'],['elder','老年']]
  .map(([stage,label])=>['resident-'+stage,label,()=>residentPreview(stage)])],
 ['作物状态',[
  ['plot-empty','空畦 / 采收后',()=>cropPreview(0)],['plot-seedling','播种后',()=>cropPreview(.1)],
  ['plot-growing','生长中',()=>cropPreview(.74)],['plot-ripe','成熟待采',()=>cropPreview(1)],
  ['plot-watered','浇水后',()=>cropPreview(.74,{},1)],['plot-drought','干旱萎蔫',()=>cropPreview(.74,{drought:true,water:.13})],
  ['plot-storm','风暴倒伏',()=>cropPreview(.74,wind)]]],
 ['天气',[
  ['weather-clear','晴朗',()=>weatherPreview({weather:'clear'})],['weather-rain','降雨',()=>weatherPreview({weather:'rain'})],
  ['weather-snow','降雪',()=>weatherPreview({season:'冬',weather:'cold'})],
  ['weather-frost','寒潮挂霜',()=>weatherPreview({season:'冬',weather:'cold',disasterToday:'coldsnap'})],
  ['weather-storm','风暴',()=>weatherPreview({...wind,weather:'rain'})],
  ['weather-drought','干旱',()=>weatherPreview({weather:'clear',drought:true,water:.13})]]],
 ['室内/院内道具',['grain','bed','hearth','furnace','table','workbench','rug','shelf','planter','trellis','bench','banner','crate','barrel','bucket','telescope','anvil','well','fence','cart'].map(k=>[k,'道具·'+k,()=>prop(k)])],
 ['手持/背包物品',['backpack','pointer','hand','axe','pick','hoe','hammer','basket','bucket','shears','wood','stone','berry','fruit','crop','egg','wool','meat','milk','water','tray','crate','sack'].map(k=>[k,'物品·'+k,()=>item(k)])],
];
function bounds(boxes){let x0=1e9,y0=1e9,z0=1e9,x1=-1e9,y1=-1e9,z1=-1e9;
 for(const b of boxes){const m=(b.rot||b.shape)?modelBounds(b):b;x0=Math.min(x0,m.x);y0=Math.min(y0,m.y);z0=Math.min(z0,m.z);x1=Math.max(x1,m.x+m.w);y1=Math.max(y1,m.y+m.h);z1=Math.max(z1,m.z+m.d);}
 return {x0,y0,z0,x1,y1,z1};}
const root=document.getElementById('root');const cards=[];
const blank={width:8,depth:8,boxes:[],floors:[],fxs:[]};
function renderCard(cv,asset){
 const p=Array.isArray(asset)?{boxes:asset}:asset;
 if (!p.boxes.length) return false;
 const b=bounds(p.boxes), span=Math.max(b.x1-b.x0,b.z1-b.z0,(b.y1-b.y0)/.77)*1.25+1;
 const camera=campCamera({x:(b.x0+b.x1)/2,z:(b.z0+b.z1)/2,width:cv.width,height:cv.height,span,yaw:.6,pitch:.5,
  targetY:(b.y0+b.y1)/2,...p.shot});
 if (!renderer?.render({target:cv,stage:p.stage??blank,work:p.work??p.boxes,camera,people:p.people??[],animals:p.animals??[],
  impacts:p.impacts,weather:p.weather,wetness:p.wetness,season:p.season,sun:p.sun,frame:0,light:p.light??[1,1,1],
  physical:true,animateParts:false})) throw new Error('WebGL 不可用');
 if (p.climate) paintWeather(cv.getContext('2d'),p.climate,previewTime,1);
 return true;
}
for(const [title,entries] of SECTIONS){
 const h=document.createElement('h2');h.textContent=title;root.append(h);
 const grid=document.createElement('div');grid.className='grid';root.append(grid);
 for(const [key,label,build] of entries){
  const card=document.createElement('div');card.className='card';card.dataset.asset=key;
  card.dataset.status=NEW_ASSETS[key]?'live':DONE[key]?'done':'todo';
  const cv=document.createElement('canvas');cv.width=196;cv.height=150;card.append(cv);
  const name=document.createElement('div');name.className='name';name.textContent=label;card.append(name);
  const tag=document.createElement('span');tag.className='tag '+(card.dataset.status==='todo'?'todo':'done');
  tag.textContent=NEW_ASSETS[key]?'服役中':DONE[key]?'已翻新':'未翻新';card.append(tag);
  const note=document.createElement('div');note.className='note';note.textContent=NEW_ASSETS[key]??DONE[key]??'';card.append(note);
  grid.append(card);cards.push(card);
  try {
   const asset=build();
   if (asset.portrait) {
    const img=document.createElement('img');img.className='age-portrait';img.alt=label+'头像';img.src=asset.portrait;
    name.before(img);
   }
   if (!renderCard(cv,asset)) note.textContent='（无几何）';
  } catch(e) {
   note.textContent='渲染失败：'+e.message;
  }
 }
}
const {files}=await(await fetch('/art-hashes.json')).json();
const pngs=Object.keys(files).filter(name=>!name.includes('/')).sort();
const h=document.createElement('h2');h.textContent='PNG 像素资产（'+pngs.length+'）';root.append(h);
const grid=document.createElement('div');grid.className='grid';root.append(grid);
for(const f of pngs){const live=/^(terrain_|prop_|tree_)/.test(f), ui=/^char_/.test(f);
 const card=document.createElement('div');card.className='card';card.dataset.status=live?'live':ui?'ui':'todo';
 const img=document.createElement('img');img.src='/web/assets/'+f;img.alt=f;card.append(img);
 const name=document.createElement('div');name.className='name';name.textContent=f;card.append(name);
 const tag=document.createElement('span');tag.className='tag '+(live||ui?'done':'todo');tag.textContent=live?'服役中':ui?'UI 保留':'未翻新';card.append(tag);
 const note=document.createElement('div');note.className='note';note.textContent=live?'3D 地面/道具贴图来源（裁决保留）':ui?'头像兜底帧（UI 保留）':'原始像素资产';card.append(note);
 grid.append(card);cards.push(card);}
const count=document.getElementById('count');
function apply(f){let n=0;for(const c of cards){const show=f==='all'||c.dataset.status===f;c.style.display=show?'':'none';if(show)n++;}count.textContent=n+' / '+cards.length+' 件';}
for(const b of document.querySelectorAll('.bar button'))b.onclick=()=>{document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));apply(b.dataset.f);};
apply('all');document.body.dataset.ready='1';
</script>
